<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <form>
      <label for="u">User Name</label>
      <input
        type="u"
        name="u"
        id="u"
        placeholder="Enter your name"
      /><br /><br />
      <label for="l">Last Name</label><br /><br />

      <label for="pass">Password</label>
      <input
        type="pass"
        name="pass"
        id="pass"
        placeholder="Enter your Password"
      /><br /><br />

      <label for="mail">Mail Id</label>
      <input type="m" name="m" id="mail" /><br /><br />

      <label for="phone">Phone no</label>
      <input type="phone" name="phone" id="phone" /><br /><br />

      <label for="q">Qty</label>
      <input type="q" name="q" id="q" /><br /><br />

      <label for="g">Gender</label>
      <label>
        <input type="radio" name="g" id="g" />
      </label>

      <label for="male">Male</label>
      <label>
        <input type="radio" name="male" id="male" />
      </label>

      <label for="female">Female</label>
      <label>
        <input type="radio" name="female" id="female" />
      </label>
      <label for="other">others</label><br /><br />
      <label for="i">Image</label>
      <input type="file" name="i" id="i" /><br /><br />
      <label for="i">Image</label>
      <input type="file" name="i" id="i" /><br /><br />

      <label>Select Color:</label>
      <input type="Color" /><br /><br />

      <label>Date of birth</label>
      <input type="Date" /><br /><br />

      <label>Time</label>
      <input type="time" /><br /><br />

      <label>Date & Time</label>
      <input type="datetime-local" /><br /><br />

      <label>Image type:</label>
      <input type="file" /><br /><br />

      <label for="value">Value attribute</label>
      <input
        type="text"
        name="value"
        id="value"
        placeholder="7777"
      /><br /><br />

      <label>Month</label>
      <input type="month" /><br /><br />

      <label>Week</label>
      <input type="week" /><br /><br />

      <label>Range</label>
      <input type="range" /><br /><br />

      <label for="s">Search</label>
      <input type="text" name="s" id="s" /><br /><br />

      <label for="no">Phone No</label>
      <input type="text" name="no" id="no" placeholder="sn" /><br /><br />

      <label for="url">URL</label>
      <input type="text" name="url" id="url" /><br /><br />

      <label>
        <input type="checkbox" name="a" id="a" />
      </label>
      <label for="a">I agree the terms and conditions</label>
      <br /><br />
      <button type="submit">Register</button>
      <button type="reset">Clear</button>
    </form>
  </body>
</html>
